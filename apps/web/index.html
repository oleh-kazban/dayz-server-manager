<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Outlive Project — Game Server Manager</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      #dsm-splash {
        display: flex;
        align-items: center;
        justify-content: center;
        position: fixed;
        inset: 0;
        min-height: 100vh;
        background-color: #f0f4f8;
      }
      @media (prefers-color-scheme: dark) {
        #dsm-splash {
          background-color: #090d12;
        }
        #dsm-splash .aegis-logo__leg--left,
        #dsm-splash .aegis-logo__bridge {
          fill: #f1f5f9;
        }
        #dsm-splash .aegis-logo__leg--right {
          fill: #94a3b8;
        }
      }
      .aegis-logo {
        display: block;
        overflow: visible;
        perspective: 900px;
        perspective-origin: 50% 50%;
      }
      .aegis-logo__tent,
      .aegis-logo__bridge {
        transform-box: fill-box;
        transform-style: preserve-3d;
        transform-origin: center center;
        will-change: transform;
      }
      .aegis-logo.is-loading .aegis-logo__tent {
        animation: aegis-tent-loading 8s infinite;
      }
      .aegis-logo.is-loading .aegis-logo__bridge {
        animation: aegis-bridge-loading 8s infinite;
      }
      @keyframes aegis-tent-loading {
        0% {
          transform: rotateY(0deg);
          animation-timing-function: ease-in-out;
        }
        37.5% {
          transform: rotateY(360deg);
        }
        100% {
          transform: rotateY(360deg);
        }
      }
      @keyframes aegis-bridge-loading {
        0% {
          transform: rotateY(0deg) rotateX(0deg);
          animation-timing-function: ease-in-out;
        }
        37.5% {
          transform: rotateY(-1080deg) rotateX(0deg);
          animation-timing-function: ease-in-out;
        }
        75% {
          transform: rotateY(-1080deg) rotateX(1080deg);
        }
        100% {
          transform: rotateY(-1080deg) rotateX(1080deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .aegis-logo.is-loading .aegis-logo__tent,
        .aegis-logo.is-loading .aegis-logo__bridge {
          animation: none;
        }
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
      }
    </style>
  </head>
  <body
    class="bg-[var(--color-canvas)] text-[var(--color-text-main)] min-h-screen antialiased selection:bg-[var(--color-primary)]/20 selection:text-[var(--color-text-main)]"
  >
    <div id="root">
      <div id="dsm-splash" role="status" aria-live="polite">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 241 248"
          width="80"
          height="80"
          class="aegis-logo is-loading"
          aria-hidden="true"
          fill-rule="evenodd"
          clip-rule="evenodd"
          stroke-linejoin="round"
          stroke-miterlimit="2"
        >
          <g transform="translate(-682.946 -1591.975)">
            <g class="aegis-logo__tent">
              <path
                class="aegis-logo__leg aegis-logo__leg--left"
                d="M802.889 1700.476l-.006-.011-57.379 99.389-62.558.02 79-136.833 9.285 16.112 9.646-16.701-9.302-16.089 31.378-54.388.012.02.011-.02 31.314 54.113z"
                fill="#1a2a46"
              />
              <path
                class="aegis-logo__leg aegis-logo__leg--right"
                d="m843.908 1662.763 79.076 137.111-62.558-.02-47.901-82.735z"
                fill="#273962"
              />
            </g>
            <path
              class="aegis-logo__bridge"
              d="m842.501 1799.874-39.536 39.535-39.536-39.535 39.536-39.536z"
              fill="#1a2a46"
            />
          </g>
        </svg>
        <span class="sr-only">Loading Outlive DayZ Server Manager...</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
