name: Setup Workspace
description: Sets up pnpm, Node.js 24, restores Nx cache, and installs frozen workspace dependencies.

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: 'pnpm'

    - name: Cache Nx computation results
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: .nx/cache
        key: ${{ runner.os }}-nx-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-nx-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-
          ${{ runner.os }}-nx-${{ github.job }}-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
