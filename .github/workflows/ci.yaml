name: CI

on:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format (Prettier)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Verify Code Formatting
        run: pnpm format:check

  static-checks:
    name: Cycles, Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Verify Architectural Cycles
        run: pnpm check:cycles

      - name: Nx Run-Many (Lint, Typecheck)
        run: pnpm nx run-many -t lint typecheck --parallel=3

  test-web:
    name: Tests (Web & UI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Nx Run-Many (Web & UI Tests)
        run: pnpm nx run-many -t test --projects="web,ui,api-client" --parallel=3

  test-server:
    name: Tests (Server & DB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Nx Run-Many (Server & DB Tests)
        run: pnpm nx run-many -t test --projects="server,database,api-contracts" --parallel=3

  build:
    name: Build (Web & Server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Nx Run-Many (Build)
        run: pnpm nx run-many -t build --parallel=3
