name: SonarQube Cloud Analysis (Fork PRs)

on:
  workflow_run:
    workflows: ['PR Validation']
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: sonar-fork-pr-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze validated fork PR
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.fork == true &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted workflow configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download source and coverage from unprivileged PR validation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-fork-inputs
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: _sonar-pr-inputs

      - name: Validate PR metadata and downloaded inputs
        id: metadata
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          PR_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          PR_HEAD_BRANCH: ${{ github.event.workflow_run.pull_requests[0].head.ref }}
          PR_BASE_BRANCH: ${{ github.event.workflow_run.pull_requests[0].base.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PR_HEAD_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$PR_HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]
          [[ "$PR_HEAD_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$PR_BASE_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ -d _sonar-pr-inputs/apps && ! -L _sonar-pr-inputs/apps ]]
          [[ -d _sonar-pr-inputs/libs && ! -L _sonar-pr-inputs/libs ]]
          [[ -s _sonar-pr-inputs/coverage/libs/ui/lcov.info ]]
          [[ ! -L _sonar-pr-inputs/coverage/libs/ui/lcov.info ]]
          if find _sonar-pr-inputs/apps _sonar-pr-inputs/libs -type l -print -quit | grep -q .; then
            echo "The downloaded source artifact contains symbolic links." >&2
            exit 1
          fi
          {
            printf 'number=%s\n' "$PR_NUMBER"
            printf 'head_sha=%s\n' "$PR_HEAD_SHA"
            printf 'head_branch=%s\n' "$PR_HEAD_BRANCH"
            printf 'base_branch=%s\n' "$PR_BASE_BRANCH"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare downloaded PR source for analysis
        run: |
          set -euo pipefail
          sed -i 's#\\#/#g; s#^SF:src/#SF:libs/ui/src/#' _sonar-pr-inputs/coverage/libs/ui/lcov.info
          mkdir -p _sonar-pr-analysis
          cp sonar-project.properties tsconfig.base.json _sonar-pr-analysis/
          mv _sonar-pr-inputs/apps _sonar-pr-inputs/libs _sonar-pr-analysis/
          mkdir -p _sonar-pr-analysis/coverage/libs/ui
          cp _sonar-pr-inputs/coverage/libs/ui/lcov.info _sonar-pr-analysis/coverage/libs/ui/lcov.info

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.DSM_GITHUB_ACTIONS || secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: _sonar-pr-analysis
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.pullrequest.key=${{ steps.metadata.outputs.number }}
            -Dsonar.pullrequest.branch=${{ steps.metadata.outputs.head_branch }}
            -Dsonar.pullrequest.base=${{ steps.metadata.outputs.base_branch }}
            -Dsonar.scm.revision=${{ steps.metadata.outputs.head_sha }}
