name: PR Validation

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BASE_REF: ${{ github.base_ref }}

jobs:
  static-checks:
    name: Format, Cycles, Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Verify Code Formatting
        run: pnpm format:check

      - name: Verify Architectural Cycles
        run: pnpm check:cycles

      - name: Nx Affected (Lint, Typecheck)
        run: >
          pnpm nx affected
          -t lint typecheck
          --base="origin/$BASE_REF"
          --head=HEAD
          --parallel=3

  test-web:
    name: Tests (Web & UI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Nx Affected (Web & UI Tests)
        run: >
          pnpm nx affected
          -t test
          --exclude="*,!web,!ui,!api-client"
          --base="origin/$BASE_REF"
          --head=HEAD
          --parallel=3

  test-server:
    name: Tests (Server & DB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Nx Affected (Server & DB Tests)
        run: >
          pnpm nx affected
          -t test
          --exclude="web,ui,api-client"
          --base="origin/$BASE_REF"
          --head=HEAD
          --parallel=3

  build:
    name: Build (Web & Server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Nx Affected (Build)
        run: >
          pnpm nx affected
          -t build
          --base="origin/$BASE_REF"
          --head=HEAD
          --parallel=3
