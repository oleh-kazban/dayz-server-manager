name: PR Validation

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PR (Format, Cycles, Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
      IS_FORK_PR: ${{ github.event.pull_request.head.repo.fork }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Code Formatting
        run: pnpm format:check

      - name: Verify Architectural Cycles
        run: pnpm check:cycles

      - name: Nx Affected (Lint, Typecheck, Test, Build)
        run: >
          pnpm nx affected
          -t lint typecheck test build
          --base="origin/$BASE_REF"
          --head=HEAD
          --parallel=3

      - name: Generate fork PR coverage
        if: env.IS_FORK_PR == 'true'
        run: pnpm nx run ui:test:coverage

      - name: Upload fork PR inputs for Sonar
        if: env.IS_FORK_PR == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-fork-inputs
          path: |
            apps/
            libs/
            coverage/libs/ui/lcov.info
          if-no-files-found: error
          retention-days: 1
