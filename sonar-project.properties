# SonarQube Cloud Monorepo Configuration
sonar.projectKey=oleh-kazban_dayz-server-manager
sonar.organization=oleh-kazban
sonar.host.url=https://sonarcloud.io

# Source code and test locations
sonar.sources=apps,libs
sonar.tests=apps,libs
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx

# Exclusions: dependencies, build outputs, Nx cache, and Storybook stories
sonar.exclusions=**/node_modules/**,**/dist/**,**/.nx/**,**/*.stories.tsx,**/coverage/**,**/vite.config.ts,**/eslint.config.js

# Code Coverage Exclusions: align with Vitest config to avoid counting pure types, registries, and entrypoints as uncovered
sonar.coverage.exclusions=\
  **/*.types.ts,\
  **/*.d.ts,\
  **/index.ts,\
  **/*.stories.{ts,tsx},\
  **/*.schema.ts,\
  **/styles/**,\
  apps/web/src/main.tsx,\
  apps/web/src/router.tsx,\
  apps/server/src/main.ts

# Test Coverage report paths (Vitest / Jest LCOV)
sonar.javascript.lcov.reportPaths=coverage/**/lcov.info

# Source file encoding
sonar.sourceEncoding=UTF-8
