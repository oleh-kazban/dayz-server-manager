# SonarQube Cloud Monorepo Configuration
sonar.projectKey=oleh-kazban_dayz-server-manager
sonar.organization=oleh-kazban
sonar.host.url=https://sonarcloud.io

# Source code and test locations
sonar.sources=apps,libs
sonar.tests=apps,libs
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx

# Exclusions: dependencies, build outputs, Nx cache, Storybook stories, and MSW mocks
sonar.exclusions=**/node_modules/**,**/dist/**,**/.nx/**,**/*.stories.tsx,**/mockServiceWorker.js,**/coverage/**,**/vite.config.ts,**/eslint.config.js

# Test Coverage report paths (Vitest / Jest LCOV)
sonar.javascript.lcov.reportPaths=coverage/**/lcov.info

# Source file encoding
sonar.sourceEncoding=UTF-8
